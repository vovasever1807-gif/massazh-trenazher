<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101418">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Медицинский массаж — тренажёр</title>
<style>
:root{
  --bg:#101418; --panel:#1a2028; --text:#f2f5f7; --muted:#a7b3bf;
  --accent:#3b82f6; --good:#15803d; --bad:#b91c1c; --good-bg:#12351f; --bad-bg:#3a1414;
  --focus:#fbbf24;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:1.15rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
main{max-width:46rem; margin:0 auto; padding:1rem}
h1{font-size:1.25rem; margin:.5rem 0 1rem}
h2{font-size:1.35rem; line-height:1.35; margin:0 0 1rem}
h3{font-size:1.1rem; margin:1.2rem 0 .5rem}
p{margin:.6rem 0}
button{
  font:inherit; color:var(--text); background:var(--panel); border:2px solid #3a4652;
  border-radius:.6rem; padding:.75rem 1rem; cursor:pointer; min-height:3rem;
}
button:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
button:disabled{opacity:.6; cursor:default}
.group{margin:0 0 1.2rem}
.group-title{font-weight:600; margin:0 0 .4rem}
button.opt{
  display:block; width:100%; text-align:left; margin:.5rem 0; padding:.9rem 1rem;
}
button.opt{font-size:1.22rem; font-weight:600}
button.opt[aria-pressed="true"]{border-color:#93c5fd; background:#1d4ed8}
button.opt.good{border-color:#22c55e; background:#22c55e; color:#07130a; font-weight:700}
button.opt.bad{border-color:#ef4444; background:#ef4444; color:#1a0505; font-weight:700}
button.opt.good:disabled, button.opt.bad:disabled{opacity:1}
.tag{display:block; font-size:.95rem; color:var(--muted); margin-top:.25rem; font-weight:400}
.feedback{margin:1rem 0; padding:.9rem 1rem; border-radius:.6rem; border-left:6px solid var(--muted)}
.feedback.good{border-color:#22c55e; background:#22c55e; color:#07130a; font-weight:600}
.feedback.bad{border-color:#ef4444; background:#ef4444; color:#1a0505; font-weight:600}
.row{display:flex; flex-wrap:wrap; gap:.6rem; margin:1rem 0}
.spacer{flex:1}
.bar{height:.5rem; background:#2a333d; border-radius:.25rem; overflow:hidden; margin:.5rem 0 1rem}
.bar>div{height:100%; background:var(--accent); width:0}
.small{font-size:.95rem; color:var(--muted)}
ul.review{padding-left:1.3rem}
ul.review li{margin:.5rem 0}
[hidden]{display:none !important}
</style>
</head>
<body>
<main>
  <h1 id="page-title" tabindex="-1">Медицинский массаж — тренажёр</h1>

  <section id="screen-start">
    <div class="group" role="group" aria-labelledby="cat-label">
      <p class="group-title" id="cat-label">Категория</p>
      <button type="button" class="opt" data-cat="highest" aria-pressed="true">Высшая категория<span class="tag">322 вопроса с ответами</span></button>
      <button type="button" class="opt" data-cat="first" aria-pressed="false">Первая категория<span class="tag" id="cnt-first"></span></button>
      <button type="button" class="opt" data-cat="second" aria-pressed="false">Вторая категория<span class="tag" id="cnt-second"></span></button>
    </div>

    <div class="group" role="group" aria-labelledby="mode-label">
      <p class="group-title" id="mode-label">Режим</p>
      <button type="button" class="opt" data-mode="train" aria-pressed="true">Тренировка<span class="tag">ответ проверяется сразу: верно — зелёным, ошибка — красным</span></button>
      <button type="button" class="opt" data-mode="exam" aria-pressed="false">Экзамен<span class="tag">без подсказок, разбор в конце</span></button>
      <button type="button" class="opt" data-mode="mock" aria-pressed="false">Как на настоящем экзамене<span class="tag">вопросы вперемешку, таймер, итог в процентах</span></button>
    </div>

    <div class="group" id="mock-group" hidden>
      <p class="group-title" id="mock-label">Параметры экзамена</p>
      <div id="mock-cnt" role="group" aria-labelledby="mock-cnt-label">
        <p class="small" id="mock-cnt-label">Сколько вопросов</p>
        <button type="button" class="opt" data-cnt="60" aria-pressed="true">60 вопросов<span class="tag">как было на первичной аккредитации</span></button>
        <button type="button" class="opt" data-cnt="80" aria-pressed="false">80 вопросов<span class="tag">как на аттестации по сестринскому делу</span></button>
        <button type="button" class="opt" data-cnt="all" aria-pressed="false">Все вопросы<span class="tag" id="mock-cnt-all"></span></button>
      </div>
      <div id="mock-time" role="group" aria-labelledby="mock-time-label">
        <p class="small" id="mock-time-label">Время</p>
        <button type="button" class="opt" data-time="60" aria-pressed="true">1 час<span class="tag">как на настоящем экзамене, по истечении — итог автоматически</span></button>
        <button type="button" class="opt" data-time="120" aria-pressed="false">2 часа<span class="tag">столько дают людям с нарушениями зрения</span></button>
        <button type="button" class="opt" data-time="0" aria-pressed="false">Без ограничения времени<span class="tag">те же вопросы вперемешку, но без таймера</span></button>
      </div>
    </div>

    <div class="group" id="block-group" role="group" aria-labelledby="block-label">
      <p class="group-title" id="block-label">Блок вопросов</p>
      <div id="blocks"></div>
    </div>

    <div class="row">
      <button class="primary" id="start">Начать</button>
    </div>
    <p class="small" id="stats-line"></p>
    <p class="small">Горячие клавиши: цифры 1–6 — выбрать ответ, Enter — ответить и перейти дальше.</p>
  </section>

  <section id="screen-quiz" hidden>
    <div class="bar" aria-hidden="true"><div id="bar-fill"></div></div>
    <p class="small" id="progress" aria-live="polite"></p>
    <p class="small" id="timer" aria-live="off" hidden></p>
    <p class="small" id="timer-alert" aria-live="polite"></p>
    <h2 id="qstem" tabindex="-1"></h2>
    <p class="small" id="qhint"></p>
    <div id="opts" role="group" aria-labelledby="qstem"></div>
    <div class="row">
      <button id="back" hidden>Назад</button>
      <button class="primary" id="answer">Ответить</button>
      <button id="next" hidden>Дальше</button>
      <span class="spacer"></span>
      <button id="finish">Завершить</button>
    </div>
    <div id="feedback" class="feedback" aria-live="assertive" tabindex="-1" hidden></div>
  </section>

  <section id="screen-result" hidden>
    <h2 id="result-title" tabindex="-1">Результат</h2>
    <div id="result-body"></div>
    <div class="row">
      <button class="primary" id="again">Ещё раз</button>
      <button id="to-start">На главную</button>
    </div>
  </section>
</main>

<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('data').textContent);
var CATS = {highest:"Высшая", first:"Первая", second:"Вторая"};
var state = {queue:[], idx:0, answers:[], mode:'train', cat:'highest', block:'0',
             sel:[], answered:false, startTime:0,
             mockCnt:60, mockMinutes:60, deadline:0, timerId:0, lastAlert:''};
var MODE_NAME = {train:'тренировка', exam:'экзамен', mock:'как на настоящем экзамене'};

function $(id){ return document.getElementById(id); }
function byCat(cat){ return DATA.filter(function(q){ return q.cat===cat; }); }
function all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

function renderCounts(){
  $('cnt-first').textContent = byCat('first').length + ' вопросов с ответами';
  $('cnt-second').textContent = byCat('second').length + ' вопросов с ответами';
  var done = 0;
  try { done = (JSON.parse(localStorage.getItem('mm_seen')||'{}').highest||[]).length; } catch(e){}
  $('stats-line').textContent = done ? ('Пройдено в тренировке по высшей: ' + done + ' из ' + byCat('highest').length) : '';
}

function press(group, btn){
  all('button', group).forEach(function(b){ b.setAttribute('aria-pressed', b===btn ? 'true' : 'false'); });
}

function renderBlocks(){
  var list = byCat(state.cat);
  var total = list.length;
  var wrap = $('blocks');
  wrap.innerHTML = '';
  for (var i=0; i<total; i+=100){
    var a=i+1, b=Math.min(i+100,total);
    var btn=document.createElement('button');
    btn.type='button';
    btn.className='opt';
    btn.setAttribute('data-block', String(i));
    btn.setAttribute('aria-pressed', i===0 ? 'true' : 'false');
    btn.innerHTML='Вопросы '+a+'–'+b+'<span class="tag">'+(b-a+1)+' шт.</span>';
    wrap.appendChild(btn);
  }
  var allBtn=document.createElement('button');
  allBtn.type='button';
  allBtn.className='opt';
  allBtn.setAttribute('data-block', 'all');
  allBtn.setAttribute('aria-pressed', 'false');
  allBtn.innerHTML='Все вопросы<span class="tag">'+total+' шт.</span>';
  wrap.appendChild(allBtn);

  var tagAll = $('mock-cnt-all');
  if (tagAll) tagAll.textContent = total + ' шт., вперемешку';

  all('button', wrap).forEach(function(b){
    b.addEventListener('click', function(){
      press(wrap, b);
      state.block = b.getAttribute('data-block');
    });
  });
}

function shuffle(a){
  for (var i=a.length-1; i>0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function start(){
  var list = byCat(state.cat).slice();
  if (state.mode === 'mock'){
    shuffle(list);
    list.forEach(function(q){ shuffle(q.o); });
    var cnt = state.mockCnt ? Math.min(state.mockCnt, list.length) : list.length;
    state.queue = list.slice(0, cnt);
  } else {
    var v = state.block;
    if (v==='all') state.queue = list;
    else { var i0=parseInt(v,10)||0; state.queue = list.slice(i0, i0+100); }
  }
  if (!state.queue.length) return;
  state.idx = 0; state.answers = new Array(state.queue.length); state.startTime = Date.now(); state.lastAlert = '';
  $('screen-start').hidden = true;
  $('screen-quiz').hidden = false;
  $('screen-result').hidden = true;
  startTimer();
  renderQuestion();
}

function clearTimer(){
  if (state.timerId){ clearInterval(state.timerId); state.timerId = 0; }
}

function fmtLeft(ms){
  if (ms < 0) ms = 0;
  var s = Math.ceil(ms/1000), m = Math.floor(s/60), r = s%60;
  return m + ' мин ' + (r<10 ? '0' : '') + r + ' с';
}

function startTimer(){
  clearTimer();
  $('timer').hidden = true;
  $('timer').textContent = '';
  $('timer-alert').textContent = '';
  if (state.mode !== 'mock' || !state.mockMinutes) return;
  state.deadline = Date.now() + state.mockMinutes*60000;
  $('timer').hidden = false;
  tickTimer();
  state.timerId = setInterval(tickTimer, 1000);
}

function tickTimer(){
  var left = state.deadline - Date.now();
  if (left <= 0){
    clearTimer();
    $('timer').textContent = 'Время вышло.';
    $('timer-alert').textContent = 'Время вышло. Показываю итог.';
    showResult(true);
    return;
  }
  $('timer').textContent = 'Осталось: ' + fmtLeft(left);
  var mins = Math.ceil(left/60000);
  if ((mins === 10 || mins === 5 || mins === 1) && state.lastAlert !== mins){
    state.lastAlert = mins;
    $('timer-alert').textContent = 'Осталось ' + mins + ' мин.';
  }
}

function renderQuestion(){
  state.answered = false;
  var prev = state.answers[state.idx];
  state.sel = prev ? prev.sel.slice() : [];
  var q = state.queue[state.idx];
  var total = state.queue.length;
  $('progress').textContent = 'Вопрос ' + (state.idx+1) + ' из ' + total + ' · ' + MODE_NAME[state.mode];
  $('bar-fill').style.width = ((state.idx)/total*100).toFixed(1)+'%';
  $('qstem').textContent = q.q;
  var hint = q.n > 1 ? ('Выберите ' + q.n + ' правильных ответа') : 'Выберите один правильный ответ';
  $('qhint').textContent = hint + ' · ' + CATS[q.cat] + ' категория, раздел ' + q.sec;

  var wrap = $('opts');
  wrap.innerHTML = '';
  q.o.forEach(function(o, i){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    btn.setAttribute('data-i', i);
    btn.setAttribute('aria-pressed', state.sel.indexOf(i) >= 0 ? 'true' : 'false');
    btn.setAttribute('aria-label', (i+1) + '. ' + o.t);
    var num = document.createElement('span');
    num.className = 'num';
    num.textContent = (i+1) + '. ';
    var txt = document.createElement('span');
    txt.textContent = o.t;
    btn.appendChild(num);
    btn.appendChild(txt);
    btn.addEventListener('click', function(){ toggleOption(i); });
    wrap.appendChild(btn);
  });

  var fb = $('feedback');
  fb.hidden = true; fb.className = 'feedback'; fb.textContent = '';
  $('answer').hidden = false; $('answer').disabled = false;
  $('next').hidden = true;
  $('back').hidden = state.idx === 0 || state.mode === 'train';
  $('next').textContent = (state.idx === state.queue.length-1) ? 'К результату' : 'Дальше';
  $('qstem').focus();
}

function toggleOption(i){
  if (state.answered) return;
  var q = state.queue[state.idx];
  var btn = $('opts').querySelector('button[data-i="'+i+'"]');
  if (!btn) return;
  if (q.n > 1){
    var pos = state.sel.indexOf(i);
    if (pos >= 0) state.sel.splice(pos,1); else state.sel.push(i);
    btn.setAttribute('aria-pressed', state.sel.indexOf(i)>=0 ? 'true' : 'false');
    if (state.mode === 'train'){
      btn.classList.remove('good','bad');
      var mark = '';
      if (state.sel.indexOf(i) >= 0){
        if (q.o[i].c){ btn.classList.add('good'); mark = ' — правильный ответ'; }
        else { btn.classList.add('bad'); mark = ' — неверно'; }
      }
      btn.setAttribute('aria-label', (i+1) + '. ' + q.o[i].t + mark);
    }
  } else {
    state.sel = [i];
    all('button', $('opts')).forEach(function(b){ b.setAttribute('aria-pressed','false'); });
    btn.setAttribute('aria-pressed','true');
    if (state.mode === 'train'){ answer(); }
  }
}

function answer(){
  if (state.answered) return;
  if (!state.sel.length){
    var fb0 = $('feedback');
    fb0.hidden=false; fb0.className='feedback'; fb0.textContent='Выберите вариант ответа.';
    fb0.focus();
    return;
  }
  state.answered = true;
  var q = state.queue[state.idx];
  var correctIdx = q.o.map(function(o,i){ return o.c ? i : -1; }).filter(function(i){ return i>=0; });
  var ok = state.sel.length===correctIdx.length && state.sel.every(function(i){ return correctIdx.indexOf(i)>=0; });
  state.answers[state.idx] = {q:q, sel:state.sel.slice(), ok:ok};

  if (state.mode === 'train'){
    q.o.forEach(function(o,i){
      var b = $('opts').querySelector('button[data-i="'+i+'"]');
      var mark = '';
      if (o.c){ b.classList.add('good'); mark = ' — правильный ответ'; }
      else if (state.sel.indexOf(i)>=0){ b.classList.add('bad'); mark = ' — ваш ответ, неверно'; }
      b.setAttribute('aria-label', (i+1) + '. ' + o.t + mark);
      b.disabled = true;
    });
    var fb = $('feedback');
    fb.hidden = false;
    fb.className = 'feedback ' + (ok ? 'good' : 'bad');
    var rightText = correctIdx.map(function(i){ return q.o[i].t; }).join('; ');
    fb.textContent = ok ? ('Верно. ' + rightText) : ('Неверно. Правильный ответ: ' + rightText);
    fb.focus();
    $('answer').hidden = true;
    $('next').hidden = false;
  } else {
    $('answer').disabled = true;
    nextQuestion();
  }
}

function nextQuestion(){
  if (state.idx >= state.queue.length-1){ showResult(); return; }
  state.idx++;
  renderQuestion();
}

function showResult(timeUp){
  timeUp = timeUp === true;
  clearTimer();
  if (timeUp) $('timer').hidden = true;
  var done = state.answers.filter(Boolean);
  var correct = done.filter(function(a){ return a.ok; }).length;
  var answered = done.length;
  var total = state.mode === 'train' ? answered : Math.max(answered, state.queue.length);
  var pct = total ? Math.round(correct/total*100) : 0;
  var secs = Math.round((Date.now()-state.startTime)/1000);
  var mins = Math.floor(secs/60), rem = secs%60;

  var html = '<p><strong>Верно: ' + correct + ' из ' + total + ' (' + pct + '%).</strong> Время: ' + mins + ' мин ' + rem + ' с.</p>';
  if (timeUp) html += '<p><strong>Время вышло.</strong> Отвечено ' + answered + ' из ' + total + '.</p>';
  if (state.mode==='mock'){
    html += '<p><strong>Порог экзамена: 70%.</strong> ' + (pct >= 70 ? 'Пройдено.' : 'Не пройдено — нужно ещё позаниматься в тренировке.') + '</p>';
  }
  if (state.mode !== 'train'){
    var wrong = done.filter(function(a){ return !a.ok; });
    if (wrong.length){
      html += '<h3>Разбор ошибок</h3><ul class="review">';
      wrong.forEach(function(a){
        var right = a.q.o.filter(function(o){ return o.c; }).map(function(o){ return o.t; }).join('; ');
        html += '<li><p>' + escapeHtml(a.q.q) + '</p><p class="small">Ваш ответ: ' + escapeHtml(a.sel.map(function(i){ return a.q.o[i].t; }).join('; ')) + '</p><p class="small">Правильно: ' + escapeHtml(right) + '</p></li>';
      });
      html += '</ul>';
    }
  }
  if (state.mode==='train'){
    try {
      var seen = JSON.parse(localStorage.getItem('mm_seen')||'{}');
      var set = seen[state.cat] || [];
      done.forEach(function(a){ if (set.indexOf(a.q.id)<0) set.push(a.q.id); });
      seen[state.cat] = set;
      localStorage.setItem('mm_seen', JSON.stringify(seen));
    } catch(e){}
  }
  $('result-body').innerHTML = html;
  $('screen-quiz').hidden = true;
  $('screen-result').hidden = false;
  $('result-title').focus();
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

all('button[data-cat]').forEach(function(b){
  b.addEventListener('click', function(){
    press(b.parentNode, b);
    state.cat = b.getAttribute('data-cat');
    state.block = '0';
    renderBlocks();
  });
});

all('button[data-mode]').forEach(function(b){
  b.addEventListener('click', function(){
    press(b.parentNode, b);
    state.mode = b.getAttribute('data-mode');
    var isMock = state.mode === 'mock';
    $('mock-group').hidden = !isMock;
    $('block-group').hidden = isMock;
  });
});

all('button[data-cnt]').forEach(function(b){
  b.addEventListener('click', function(){
    press(b.parentNode, b);
    var v = b.getAttribute('data-cnt');
    state.mockCnt = v === 'all' ? 0 : parseInt(v,10);
  });
});

all('button[data-time]').forEach(function(b){
  b.addEventListener('click', function(){
    press(b.parentNode, b);
    state.mockMinutes = parseInt(b.getAttribute('data-time'),10) || 0;
  });
});

$('start').addEventListener('click', start);
$('answer').addEventListener('click', answer);
$('next').addEventListener('click', nextQuestion);
$('back').addEventListener('click', function(){ if (state.idx > 0){ state.idx--; renderQuestion(); } });
$('finish').addEventListener('click', showResult);
$('again').addEventListener('click', function(){ $('screen-result').hidden=true; $('screen-start').hidden=false; renderCounts(); renderBlocks(); });
$('to-start').addEventListener('click', function(){ $('screen-result').hidden=true; $('screen-start').hidden=false; renderCounts(); renderBlocks(); });

document.addEventListener('keydown', function(e){
  if ($('screen-quiz').hidden) return;
  if (e.key >= '1' && e.key <= '6'){
    var i = parseInt(e.key,10)-1;
    var btn = $('opts').querySelector('button[data-i="'+i+'"]');
    if (btn && !btn.disabled){ e.preventDefault(); toggleOption(i); btn.focus(); }
  } else if (e.key === 'Enter'){
    var active = document.activeElement;
    if (active && active.parentNode === $('opts')){
      e.preventDefault();
      if (state.answered) nextQuestion(); else answer();
    }
  }
});

renderCounts();
renderBlocks();
$('page-title').focus();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
</body>
</html>
